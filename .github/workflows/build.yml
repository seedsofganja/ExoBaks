# Compila e testa a ogni push/PR. Su un tag "v*" (es. v1.1.0) pubblica una
# GitHub Release con lo zip dell'eseguibile.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild "ExoCAD Tool.sln" /restore /p:Configuration=Release /v:minimal

      - name: Test
        run: dotnet test "ExoCAD Tool.Tests/ExoCAD Tool.Tests.csproj" -c Release --no-build

      - name: Pacchetto
        shell: pwsh
        run: |
          Compress-Archive -DestinationPath ExoCAD-Tool.zip -Path `
            "ExoCAD Tool/bin/Release/ExoCAD Tool.exe", `
            "ExoCAD Tool/bin/Release/ExoCAD Tool.exe.config"

      - uses: actions/upload-artifact@v4
        with:
          name: ExoCAD-Tool
          path: ExoCAD-Tool.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ExoCAD-Tool.zip
          generate_release_notes: true
